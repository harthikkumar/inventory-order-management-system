version: "3.9"

services:
  backend:
    build: ./backend
    container_name: inventory_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./inventory.db
    volumes:
      - backend_data:/app

  frontend:
    build: ./frontend
    container_name: inventory_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  backend_data: